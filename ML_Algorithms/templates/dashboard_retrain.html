<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Pipeline - Echtzeit Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-7xl bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6 border border-gray-700">
        
        <header class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-white"><span id="algorithm-name">{{ config.model_name | default('ML', true) }}</span> Pipeline</h1>
            <p class="text-gray-400 mt-2">Live-Überwachung des Inferenz- und Trainingsprozesses</p>
        </header>
        
        <div id="status-container" class="text-center p-4 rounded-lg bg-gray-700 border border-gray-600">
            <p id="status-text" class="text-lg font-semibold">Initialisiere...</p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
            
            <div class="bg-gray-700/50 p-4 rounded-lg space-y-3">
                <div>
                    <p class="text-sm text-gray-400">CPU Last</p>
                    <p id="cpu-load" class="text-2xl font-semibold">- %</p>
                </div>
                <div class="border-t border-gray-600/50"></div>
                <div>
                    <p class="text-sm text-gray-400">RAM Auslastung</p>
                    <p class="text-xl font-semibold">
                        <span id="ram-usage-percent">--</span>%
                        (<span id="ram-usage-values">--/-- GB</span>)
                    </p>
                </div>
            </div>

            <div class="bg-gray-700/50 p-4 rounded-lg flex flex-col justify-center">
                <p class="text-sm text-gray-400">Gesamt- / Inferenzzeit</p>
                <p class="text-xl font-semibold mt-1">
                    <span id="total-time-val">-</span> / <span id="inference-time-val">-</span> ms
                </p>
            </div>

            <div class="bg-gray-700/50 p-4 rounded-lg">
                <p class="text-sm text-gray-400">Retraining</p>
                <div class="flex items-center justify-center space-x-2 mt-2">
                    <div id="retraining-dot" class="status-dot bg-gray-500"></div>
                    <p id="retraining-status" class="text-lg font-semibold">Inaktiv</p>
                </div>
            </div>
            <div class="bg-gray-700/50 p-4 rounded-lg">
                <p class="text-sm text-gray-400">Fortschritt</p>
                <p id="progress-text" class="text-lg font-semibold mt-2">0 / 0</p>
            </div>
        </div>

        <div class="w-full bg-gray-700 rounded-full h-2.5">
            <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <div class="relative h-64 md:h-96 bg-gray-900/50 p-4 rounded-xl border border-gray-700">
            <canvas id="inferenceChart"></canvas>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
            <button id="pauseResumeButton" class="w-full sm:w-auto bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105 disabled:bg-gray-500 disabled:cursor-not-allowed" disabled>Pause</button>
            <button id="resetButton" class="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105">Reset</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dom = {
                statusText: document.getElementById('status-text'),
                cpuLoad: document.getElementById('cpu-load'),
                totalTimeVal: document.getElementById('total-time-val'),
                inferenceTimeVal: document.getElementById('inference-time-val'),
                retrainingStatus: document.getElementById('retraining-status'),
                retrainingDot: document.getElementById('retraining-dot'),
                progressText: document.getElementById('progress-text'),
                progressBar: document.getElementById('progress-bar'),
                pauseResumeButton: document.getElementById('pauseResumeButton'),
                resetButton: document.getElementById('resetButton'),
                chartCanvas: document.getElementById('inferenceChart').getContext('2d'),
                ramUsagePercent: document.getElementById('ram-usage-percent'),
                ramUsageValues: document.getElementById('ram-usage-values')
            };

            let chart;
            const statusMapping = {
                initializing: "Initialisiere Pipeline...",
                inference_running: "Inferenz & Datensammlung läuft...",
                finished: "Pipeline abgeschlossen.",
                error: "Fehler in der Pipeline!"
            };
            const retrainingMapping = {
                idle: { text: "Inaktiv", color: "bg-gray-500", pulse: false },
                collecting: { text: "Sammelt Daten", color: "bg-yellow-500", pulse: true },
                training: { text: "Trainiert...", color: "bg-blue-500", pulse: true }
            };

            function initializeChart() {
                if (chart) chart.destroy();
                chart = new Chart(dom.chartCanvas, {
                    type: 'line',
                    data: {
                        labels: [], 
                        datasets: [
                            { label: 'Echter Wert', data: [], borderColor: 'rgb(59, 130, 246)', tension: 0.2, pointRadius: 2 }, 
                            { label: 'Vorhersage (t+1)', data: [], borderColor: 'rgb(234, 179, 8)', tension: 0.2, pointRadius: 2 },
                            { label: `Zukunftsprognose (rollierend)`, data: [], borderColor: 'rgb(34, 197, 94)', borderDash: [5, 5], tension: 0.2, pointRadius: 3, pointStyle: 'rectRot' },
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        scales: {
                            x: { type: 'time', time: { unit: 'second', tooltipFormat: 'HH:mm:ss' }, ticks: { color: '#9CA3AF' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                            y: { ticks: { color: '#9CA3AF' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } }
                        },
                        plugins: { legend: { labels: { color: '#D1D5DB' } } }
                    }
                });
            }
            
            function addDataToChart(dataPoint) {
                const { datetime, true_value, prediction, rolling_forecast, rolling_forecast_dates } = dataPoint;
                
                chart.data.labels.push(datetime);
                chart.data.datasets[0].data.push(true_value);
                chart.data.datasets[1].data.push(prediction);

                const forecastPoints = [];
                if (prediction != null) {
                    forecastPoints.push({ x: datetime, y: prediction }); 
                }
                if (rolling_forecast && rolling_forecast_dates) {
                    for (let i = 0; i < rolling_forecast.length; i++) {
                        forecastPoints.push({ x: rolling_forecast_dates[i], y: rolling_forecast[i] });
                    }
                }
                chart.data.datasets[2].data = forecastPoints;

                const MAX_DATA_POINTS = 60;
                if (chart.data.labels.length > MAX_DATA_POINTS) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.shift();
                }

                chart.update('none');
            }

            async function fetchApi(endpoint, options = {}) {
                try {
                    const response = await fetch(endpoint, options);
                    if (!response.ok) {
                        console.error(`API Fehler bei ${endpoint}: Status ${response.status}`);
                        dom.statusText.textContent = 'Serverfehler.';
                        return null;
                    }
                    return response.json();
                } catch (error) {
                    console.error(`API Fehler bei ${endpoint}:`, error);
                    dom.statusText.textContent = 'Verbindung zum Server verloren.';
                }
            }
            
            function updateUI(state) {
                dom.statusText.textContent = statusMapping[state.status] || state.status || "Unbekannter Status";
                if(state.error_message) {
                    dom.statusText.textContent += ` | Fehler: ${state.error_message}`;
                }

                const retrainInfo = retrainingMapping[state.retraining_status] || retrainingMapping.idle;
                dom.retrainingStatus.textContent = retrainInfo.text;
                dom.retrainingDot.className = `status-dot ${retrainInfo.color}`;
                dom.retrainingDot.classList.toggle('pulse', retrainInfo.pulse);

                const progressText = `Zyklus ${state.cycle_count}/${state.total_cycles} | Schritt ${state.steps_in_cycle}/${state.total_steps}`;
                dom.progressText.textContent = progressText;
                
                const progressPercentage = state.total_steps > 0 ? (state.steps_in_cycle / state.total_steps) * 100 : 0;
                dom.progressBar.style.width = `${progressPercentage}%`;

                dom.pauseResumeButton.disabled = state.status !== 'inference_running' || state.is_finished;
                if (state.is_paused) {
                    dom.pauseResumeButton.textContent = 'Fortsetzen';
                    dom.pauseResumeButton.classList.replace('bg-yellow-500', 'bg-green-600');
                    dom.pauseResumeButton.classList.replace('hover:bg-yellow-600', 'hover:bg-green-700');
                } else {
                    dom.pauseResumeButton.textContent = 'Pause';
                    dom.pauseResumeButton.classList.replace('bg-green-600', 'bg-yellow-500');
                    dom.pauseResumeButton.classList.replace('hover:bg-green-700', 'hover:bg-yellow-600');
                }
            }

            async function sendControl(action) {
                await fetchApi('/api/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                // Rufen Sie pollServer einmalig sofort auf, um die UI direkt zu aktualisieren,
                // anstatt auf das nächste Intervall zu warten.
                pollServer();
            }

            // =============================================================================
            // === NEUE, VEREINHEITLICHTE POLLING-LOGIK ===
            // =============================================================================
            let currentStep = 0; // Der Zähler für die Datenpunkte
            let pollingInterval;   // Variable für unser Intervall

            async function pollServer() {
                // 1. Immer den neuesten Status vom Server holen
                const state = await fetchApi('/api/status');
                
                if (!state) {
                    // Wenn kein Status empfangen wird (z.B. Server down), nichts weiter tun.
                    // fetchApi sollte bereits einen Fehler in der Konsole geloggt haben.
                    return; 
                }

                // 2. Immer die komplette UI mit dem frischen Status aktualisieren
                updateUI(state);

                // 3. Prüfen, ob wir neue Datenpunkte abrufen sollen
                // Wir fragen nur nach neuen Daten, wenn die Inferenz aktiv ist und nicht pausiert wurde.
                if (state.status === 'inference_running' && !state.is_paused) {
                    
                    // Fordere den nächsten Datenpunkt an, den wir noch nicht haben
                    const result = await fetchApi(`/api/data?step=${currentStep}`);

                    if (result && result.status === 'success') {
                        // Wir haben erfolgreich neue Daten erhalten!
                        
                        // a) Daten dem Diagramm hinzufügen
                        addDataToChart(result.data);
                        
                        // b) Spezifische Metriken aus den neuen Daten aktualisieren
                        dom.cpuLoad.textContent = `${result.data.cpu_load.toFixed(1)} %`;
                        dom.totalTimeVal.textContent = result.data.total_processing_time_ms.toFixed(2);
                        dom.inferenceTimeVal.textContent = result.data.model_inference_time_ms.toFixed(2);
                        
                        if (result.data.ram_usage) {
                            const ram = result.data.ram_usage;
                            dom.ramUsagePercent.textContent = ram.percent.toFixed(1);
                            dom.ramUsageValues.textContent = `${ram.used_gb}/${ram.total_gb} GB`;
                        }

                        // c) WICHTIG: Zähler für den nächsten Schritt erhöhen
                        currentStep++;
                    }
                    // Wenn result.status "waiting" ist, passiert nichts. Wir versuchen es im nächsten Intervall erneut für denselben `currentStep`.
                }

                // 4. Wenn die Pipeline abgeschlossen ist, das Polling stoppen
                if (state.is_finished || state.status === 'error') {
                    console.log("Pipeline beendet oder fehlerhaft. Polling wird gestoppt.");
                    clearInterval(pollingInterval);
                }
            }
            
            // Event Listener
            dom.pauseResumeButton.addEventListener('click', () => {
                const action = dom.pauseResumeButton.textContent === 'Pause' ? 'pause' : 'resume';
                sendControl(action);
            });
            dom.resetButton.addEventListener('click', () => window.location.reload());

            // Initialisierung
            initializeChart();
            
            // Starten Sie den zentralen Polling-Mechanismus
            pollingInterval = setInterval(pollServer, 1000);
        });
    </script>
</body>
</html>
