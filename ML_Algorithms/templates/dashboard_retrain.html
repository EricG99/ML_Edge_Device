<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retraining Pipeline Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }
        .status-dot.idle { background-color: #6b7280; animation: none; }
        .status-dot.collecting { background-color: #f59e0b; }
        .status-dot.training { background-color: #3b82f6; }
        .status-dot.error { background-color: #ef4444; animation: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-gray-900">LSTM Retraining Pipeline</h1>
            <p class="text-lg text-gray-600 mt-2">Live-Überwachung des Inferenz- und inkrementellen Trainingsprozesses.</p>
        </header>

        <!-- Status & Control Panel -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-md flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">Pipeline Status</p>
                    <p id="pipeline-status" class="text-2xl font-semibold">Initialisierung...</p>
                </div>
                <div id="status-indicator-main" class="w-8 h-8 bg-yellow-400 rounded-full"></div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md">
                <p class="text-sm font-medium text-gray-500">Retraining Status</p>
                <div class="flex items-center mt-2">
                     <div id="retraining-dot" class="status-dot idle mr-3"></div>
                     <p id="retraining-status" class="text-2xl font-semibold">Inaktiv</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md">
                <p class="text-sm font-medium text-gray-500">Fortschritt</p>
                 <p id="progress-text" class="text-2xl font-semibold">Zyklus 0 / 0</p>
                 <div class="w-full bg-gray-200 rounded-full h-2.5 mt-3">
                    <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Error Display -->
        <div id="error-banner" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-8 rounded-md" role="alert">
            <p class="font-bold">Ein Fehler ist aufgetreten</p>
            <p id="error-message">Details zum Fehler werden hier angezeigt.</p>
        </div>

        <!-- Live Chart -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-2xl font-semibold mb-4">Live Vorhersage vs. Echte Werte</h2>
            <canvas id="liveChart"></canvas>
        </div>

    </div>

    <script>
        const pipelineStatusEl = document.getElementById('pipeline-status');
        const statusIndicatorMainEl = document.getElementById('status-indicator-main');
        const retrainingStatusEl = document.getElementById('retraining-status');
        const retrainingDotEl = document.getElementById('retraining-dot');
        const progressTextEl = document.getElementById('progress-text');
        const progressBarEl = document.getElementById('progress-bar');
        const errorBannerEl = document.getElementById('error-banner');
        const errorMessageEl = document.getElementById('error-message');

        const statusColors = {
            initializing: 'bg-gray-400',
            initial_training_complete: 'bg-blue-500',
            inference_running: 'bg-green-500',
            finished: 'bg-gray-600',
            error: 'bg-red-500'
        };
        
        const retrainingClasses = {
            idle: { text: 'Inaktiv', dot: 'idle' },
            collecting: { text: 'Sammelt Daten', dot: 'collecting' },
            training: { text: 'Trainiert...', dot: 'training' }
        };

        // --- Chart.js Setup ---
        const ctx = document.getElementById('liveChart').getContext('2d');
        const liveChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Echter Wert',
                    data: [],
                    borderColor: 'rgb(54, 162, 235)',
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderWidth: 2,
                    pointRadius: 4,
                    tension: 0.1
                }, {
                    label: 'Vorhersage',
                    data: [],
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.5)',
                    borderWidth: 2,
                    pointRadius: 4,
                    tension: 0.1
                }]
            },
            options: {
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'second',
                            tooltipFormat: 'HH:mm:ss',
                            displayFormats: {
                                second: 'HH:mm:ss'
                            }
                        },
                        title: {
                            display: true,
                            text: 'Zeit'
                        }
                    },
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: 'Wert'
                        }
                    }
                },
                animation: {
                    duration: 500
                }
            }
        });

        function addDataToChart(label, trueValue, predValue) {
            liveChart.data.labels.push(label);
            liveChart.data.datasets[0].data.push(trueValue);
            liveChart.data.datasets[1].data.push(predValue);

            // Chart auf eine maximale Anzahl von Datenpunkten beschränken
            const maxDataPoints = 50;
            if (liveChart.data.labels.length > maxDataPoints) {
                liveChart.data.labels.shift();
                liveChart.data.datasets.forEach(dataset => {
                    dataset.data.shift();
                });
            }
            liveChart.update();
        }

        // --- API Polling ---
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                // Hauptstatus aktualisieren
                pipelineStatusEl.textContent = data.status.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                statusIndicatorMainEl.className = `w-8 h-8 rounded-full ${statusColors[data.status] || 'bg-gray-400'}`;

                // Retraining-Status aktualisieren
                const retrainInfo = retrainingClasses[data.retraining_status] || retrainingClasses.idle;
                retrainingStatusEl.textContent = retrainInfo.text;
                retrainingDotEl.className = `status-dot ${retrainInfo.dot} mr-3`;
                
                // Fortschritt aktualisieren
                const totalCycles = 5; // Replace with actual value or fetch dynamically
                const stepsPerCycle = 100; // Replace with actual value or fetch dynamically
                progressTextEl.textContent = `Zyklus ${data.cycle_count} / ${totalCycles} | Schritt ${data.steps_in_cycle} / ${stepsPerCycle}`;
                
                const progressPercentage = (data.steps_in_cycle / stepsPerCycle) * 100;
                progressBarEl.style.width = `${progressPercentage}%`;


                if (data.status === 'error') {
                    errorMessageEl.textContent = data.error_message;
                    errorBannerEl.classList.remove('hidden');
                } else {
                    errorBannerEl.classList.add('hidden');
                }

            } catch (error) {
                console.error('Fehler beim Abrufen des Status:', error);
                pipelineStatusEl.textContent = 'Verbindung verloren';
                statusIndicatorMainEl.className = 'w-8 h-8 bg-red-500 rounded-full';
            }
        }

        let lastDataTimestamp = null;
        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const result = await response.json();

                if (result.status === 'success' && result.data.datetime !== lastDataTimestamp) {
                    lastDataTimestamp = result.data.datetime;
                    addDataToChart(result.data.datetime, result.data.true_value, result.data.prediction);
                }
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
            }
        }

        // --- Interval Timers ---
        setInterval(fetchStatus, 1000); // Status jede Sekunde abrufen
        setInterval(fetchData, 1000); // Replace with actual interval or fetch dynamically
        
        // Initialer Aufruf
        fetchStatus();
        fetchData();
    </script>
</body>
</html>
